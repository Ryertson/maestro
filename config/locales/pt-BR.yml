  # --- TRADUÇÕES DO DEVISE ---
  devise:
    failure:
      unauthenticated: "Você precisa entrar ou se cadastrar antes de continuar."
      already_authenticated: "Você já está logado no sistema."
      invalid: "Email ou senha inválidos."
      not_found_in_database: "Email ou senha inválidos."
      locked: "Sua conta está bloqueada."
      inactive: "Sua conta ainda não foi ativada."
      # Específico para o StudentUser se houver conflito
      student_user:
        already_authenticated: "Você já está logado como aluno."
    sessions:
      signed_in: "Login realizado com sucesso."
      signed_out: "Logout realizado com sucesso."
    registrations:
      signed_up: "Cadastro realizado com sucesso."
      updated: "Conta atualizada com sucesso."
      destroyed: "Tchau! Sua conta foi cancelada com sucesso. Esperamos ver você novamente em breve."

  # --- TRADUÇÕES DE ERROS GERAIS (Resolve o erro inicial de 'not_saved') ---
  errors:
    messages:
      not_saved:
        one: "1 erro impediu que este %{resource} fosse salvo:"
        other: "%{count} erros impediram que este %{resource} fosse salvo:"
      required: "é obrigatório(a)"

  # --- TRADUÇÕES DE ATRIBUTOS ---
  activerecord:
    errors:
      models:
        student_user:
          attributes:
            student:
              required: "precisa ser selecionado na lista"
            student_id:
              required: "não pode ficar em branco"
              taken: "já possui um acesso cadastrado"